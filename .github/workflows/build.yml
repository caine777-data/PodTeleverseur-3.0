name: Build installers

# Compile Pod Téléverseur et publie les livrables D'INSTALLATION SEULEMENT
# (plus de version portable) :
#   • PodTeleverseur-Windows-Setup.exe — installeur Inno Setup
#   • PodTeleverseur-macOS.dmg         — image disque
#
# Chaque nom de fichier PUBLIÉ porte son OS, pour qu'une personne qui
# télécharge depuis la page de Release ne puisse pas se tromper.
#
# Déclencheurs :
#   • Bouton « Run workflow » dans l'onglet Actions (build manuel)
#   • Push d'un tag v* (ex : v3.0.0) → crée automatiquement une Release GitHub
#
# NB : les runners macOS de GitHub sont Apple Silicon → l'app produite est arm64
#      (ne tourne pas sur Mac Intel sans adaptation).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Écrire OUI pour PUBLIER une version (le numéro est lu dans __version__.py). Laisser VIDE = compilation d'essai."
        required: false
        default: ""
      notes:
        description: "Phrase affichée dans le bandeau de mise à jour (facultatif)"
        required: false
        default: ""
      obligatoire:
        description: >-
          Rendre cette mise à jour OBLIGATOIRE : les postes en version
          antérieure afficheront une fenêtre bloquante (aucun bandeau) tant
          qu'ils n'ont pas mis à jour. La fenêtre affiche un message neutre,
          sans en donner la raison. Laisser décoché pour une publication
          normale.
        required: false
        type: boolean
        default: false
      version_minimale:
        description: >-
          Version en dessous de laquelle l'application est considérée
          périmée (ex. 2.5.0). Si "obligatoire" est coché et ce champ laissé
          vide, la version publiée elle-même sert de seuil : TOUT poste non à
          jour sera alors bloqué.
        required: false
        default: ""
      blocage:
        description: >-
          Blocage à distance, INDÉPENDANT de la mise à jour ci-dessus (voir
          BLOCAGE.md). « bloquer » : toutes les applications installées
          affichent « Pod Téléverseur n'est pas disponible » et deviennent
          inutilisables (seul Quitter reste possible). « débloquer » : elles
          redeviennent normales. Ces deux choix ne compilent rien. Laisser
          « ne rien changer » pour une compilation/publication normale — état
          par défaut, ce blocage ne se déclenche donc jamais tout seul.
        type: choice
        options:
          - ne rien changer
          - bloquer
          - débloquer
        default: ne rien changer

# Moindre privilège : par défaut, le jeton GITHUB_TOKEN de chaque job ne peut
# que LIRE le dépôt. Les jobs de compilation n'ont rien à y écrire ; seul le
# job « release » reçoit, plus bas, contents: write pour créer la Release.
permissions:
  contents: read

jobs:
  # ─────────────────────────────── WINDOWS ───────────────────────────────
  build-windows:
    # Ignoré quand on actionne le blocage (voir le job « blocage »).
    if: inputs.blocage != 'bloquer' && inputs.blocage != 'débloquer'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # L'icône de l'application est fournie dans assets/icon.ico.
      # On la copie sous le nom attendu par l'étape de compilation.
      - name: Préparer l'icône Windows
        run: copy assets\icon.ico assets\podteleverseur.ico

      - name: Compiler PodTeleverseur.exe (portable)
        run: |
          $icon = (Test-Path "assets/podteleverseur.ico") ? "--icon=assets/podteleverseur.ico" : ""
          pyinstaller --onefile --windowed --name "PodTeleverseur" `
            --version-file version.txt `
            $icon `
            --collect-all customtkinter `
            --collect-all keyring `
            --collect-all tkinterdnd2 `
            --add-data "assets;assets" `
            app.py

      # Le portable n'est plus publié : seul l'installeur figure dans la
      # Release. L'exe reste produit ici, car Inno Setup l'embarque.

      # Installe Inno Setup (compilateur d'installeurs Windows) via Chocolatey.
      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      # Génère le script .iss puis compile l'installeur.
      # Installation SANS droits administrateur (dans le profil utilisateur),
      # avec raccourcis menu Démarrer + Bureau et désinstalleur.
      - name: Fabriquer l'installeur (Inno Setup)
        run: |
          # Version lue dans __version__.py : elle était écrite ici EN DUR
          # (3.1.0) et restait fausse dans l'installeur et la liste des
          # programmes Windows à chaque nouvelle version.
          $ver = (Select-String -Path "__version__.py" -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $ver) { Write-Error "Version introuvable dans __version__.py"; exit 1 }
          Write-Host "Version de l'installeur : $ver"
          $iss = @"
          [Setup]
          ; ⚠️ MÊME AppId que le Pod Téléverseur v2 : c'est lui qui fait
          ; reconnaître la v3 comme une MISE À JOUR de la v2 (remplacement sur
          ; place). Sans lui, les deux coexisteraient dans la liste des
          ; programmes. Ne jamais le modifier.
          AppId={{8F3A6C21-4D7B-4E2A-9C15-7B2E5D9A1C04}}
          AppName=Pod Televerseur
          AppVersion=$ver
          AppPublisher=Universite de Toulouse
          DefaultDirName={localappdata}\Programs\PodTeleverseur
          DefaultGroupName=Pod Televerseur
          PrivilegesRequired=lowest
          OutputDir=installer
          OutputBaseFilename=PodTeleverseur-Setup
          Compression=lzma
          SolidCompression=yes
          SetupIconFile=assets\podteleverseur.ico
          WizardStyle=modern

          [Languages]
          Name: "french"; MessagesFile: "compiler:Languages\French.isl"

          [Files]
          Source: "dist\PodTeleverseur.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Pod Televerseur"; Filename: "{app}\PodTeleverseur.exe"
          Name: "{group}\Desinstaller Pod Televerseur"; Filename: "{uninstallexe}"
          Name: "{userdesktop}\Pod Televerseur"; Filename: "{app}\PodTeleverseur.exe"

          [Run]
          Filename: "{app}\PodTeleverseur.exe"; Description: "Lancer Pod Televerseur"; Flags: nowait postinstall skipifsilent
          "@
          # Si l'icône n'a pas été générée, on retire la ligne SetupIconFile.
          if (-not (Test-Path "assets/podteleverseur.ico")) {
            $iss = $iss -replace "SetupIconFile=assets\\podteleverseur.ico`r?`n", ""
          }
          Set-Content -Path "PodTeleverseur.iss" -Value $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "PodTeleverseur.iss"

      # Renommé PENDANT la compilation : c'est le nom du FICHIER que verra
      # la personne qui télécharge, pas le libellé de l'artefact GitHub.
      - name: Renommer l'installeur avec le nom d'OS explicite
        run: |
          Rename-Item "installer\PodTeleverseur-Setup.exe" `
            "PodTeleverseur-Windows-Setup.exe"

      - name: Publier l'installeur Windows
        uses: actions/upload-artifact@v4
        with:
          name: PodTeleverseur-Windows-Setup
          path: installer/PodTeleverseur-Windows-Setup.exe

  # ──────────────────────────────── macOS ────────────────────────────────
  build-macos:
    if: inputs.blocage != 'bloquer' && inputs.blocage != 'débloquer'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Génère l'icône macOS (.icns) à partir du PNG master, via les outils
      # Apple sips/iconutil (présents uniquement sur les runners macOS).
      - name: Générer l'icône macOS (.icns)
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon_master.png --out "icon.iconset/icon_${s}x${s}.png"
            d=$((s*2))
            sips -z $d $d assets/icon_master.png --out "icon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns icon.iconset -o assets/icon.icns

      - name: Compiler PodTeleverseur.app
        run: |
          # --onefile : build macOS léger (~20-30 Mo) au prix d'un avertissement
          # de dépréciation PyInstaller (toléré aujourd'hui, bloquant en v7.0).
          pyinstaller --onefile --windowed --name "PodTeleverseur" \
            --icon assets/icon.icns \
            --collect-all customtkinter \
            --collect-all keyring \
            --collect-all tkinterdnd2 \
            --add-data "assets:assets" \
            app.py

      # Le .zip de l'archive .app n'est plus fabriqué : il n'est plus publié.
      # (Le jour où il reviendrait : utiliser `ditto`, pas `zip`, qui casse la
      # signature et fait réapparaître « est endommagé ».)

      - name: Fabriquer le DMG (glisser-déposer vers Applications)
        run: |
          mkdir -p dmg_stage
          cp -R "dist/PodTeleverseur.app" dmg_stage/ 2>/dev/null || cp -R "dist/PodTeleverseur" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Pod Televerseur" -srcfolder dmg_stage \
            -ov -format UDZO "dist/PodTeleverseur.dmg"

      - name: Renommer le .dmg avec le nom d'OS explicite
        run: mv dist/PodTeleverseur.dmg dist/PodTeleverseur-macOS.dmg

      - name: Publier le DMG macOS
        uses: actions/upload-artifact@v4
        with:
          name: PodTeleverseur-macOS-DMG
          path: dist/PodTeleverseur-macOS.dmg

  # ──────────────────────── Blocage à distance ─────────────────────────
  # Ne compile rien, ne concerne aucun numéro de version : écrit seulement
  # etat.json sur le dépôt PUBLIC, lu par toutes les applications installées
  # (au démarrage puis toutes les heures). RELEASES_TOKEN : même jeton, déjà
  # configuré, que celui qui publie version.json. Voir BLOCAGE.md.
  blocage:
    name: Blocage à distance
    if: inputs.blocage == 'bloquer' || inputs.blocage == 'débloquer'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publier l'état
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DEPOT: ${{ vars.RELEASES_REPO || format('{0}/podteleverseur-releases', github.repository_owner) }}
          BLOQUE: ${{ inputs.blocage == 'bloquer' }}
        run: |
          set -e
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Secret RELEASES_TOKEN absent : rien n'a été publié (voir BLOCAGE.md)."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${RELEASES_TOKEN}@github.com/${DEPOT}.git" public
          printf '{\n  "bloque": %s\n}\n' "$BLOQUE" > public/etat.json
          echo "Contenu publié sur $DEPOT :" && cat public/etat.json
          cd public
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add etat.json
          git diff --cached --quiet || git commit -m "Etat"
          git push

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Publication sur tag v*, OU sur « Run workflow » avec le champ version
    # rempli. Champ vide = compilation d'essai, rien n'est publié.
    # Jamais pendant un blocage/déblocage, même si le champ version est rempli.
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') && inputs.blocage != 'bloquer' && inputs.blocage != 'débloquer'
    # Le jeton automatique de GitHub Actions est en LECTURE SEULE par défaut :
    # sans cette autorisation, la création de la Release échoue en 403.
    permissions:
      contents: write
    steps:
      # ORDRE IMPORTANT : le checkout d'abord, car il NETTOIE le dossier de
      # travail. Placé après, il supprimerait les artefacts téléchargés.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      # Le numéro vient du CODE (__version__.py), jamais du formulaire : sinon
      # l'application pourrait s'annoncer dans une version et en afficher une
      # autre, et signaler en permanence une mise à jour… vers elle-même.
      - name: Déterminer le numéro de version (depuis le code)
        id: v
        shell: bash
        run: |
          NUM=$(grep -oE '__version__[[:space:]]*=[[:space:]]*"[^"]+"' __version__.py | grep -oE '"[^"]+"' | tr -d '"')
          if [ -z "$NUM" ]; then
            echo "::error::Impossible de lire la version dans __version__.py"
            exit 1
          fi
          echo "num=$NUM" >> "$GITHUB_OUTPUT"
          echo "Version publiée (lue dans le code) : $NUM"

      # La Release est publiée sur le dépôt PUBLIC, et non sur ce dépôt privé :
      # le bouton « Télécharger » du bandeau renvoie vers lui. Publier ici
      # donnerait une page inaccessible (404) à tout enseignant.
      #
      # L'écriture se fait avec RELEASES_TOKEN : le jeton automatique de
      # GitHub Actions n'a aucun droit en dehors de ce dépôt-ci.
      - name: Créer la release sur le dépôt public
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASES_REPO || format('{0}/podteleverseur-releases', github.repository_owner) }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.v.outputs.num }}
          name: Pod Téléverseur v${{ steps.v.outputs.num }}
          body: ${{ inputs.notes || 'Nouvelle version.' }}
          # Uniquement les fichiers d'INSTALLATION : plus de version portable
          # dans la Release. Chaque nom de fichier porte explicitement son OS,
          # pour qu'une personne qui télécharge ne puisse pas se tromper.
          files: |
            PodTeleverseur-Windows-Setup/PodTeleverseur-Windows-Setup.exe
            PodTeleverseur-macOS-DMG/PodTeleverseur-macOS.dmg

      # ── Notification de mise à jour ────────────────────────────────────
      # Écrit `version.json` sur le dépôt PUBLIC. C'est ce fichier que les
      # applications installées consultent au démarrage.
      #
      # Sans le secret RELEASES_TOKEN, l'étape est IGNORÉE : la compilation se
      # déroule normalement, seule la notification n'est pas publiée.
      - name: Publier version.json sur le dépôt public
        if: env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DEPOT_PUBLIC: ${{ vars.RELEASES_REPO }}
        run: |
          set -e
          VERSION="${{ steps.v.outputs.num }}"
          DEPOT="${DEPOT_PUBLIC:-${GITHUB_REPOSITORY_OWNER}/podteleverseur-releases}"
          NOTES="${{ inputs.notes }}"
          [ -z "$NOTES" ] && NOTES="Nouvelle version disponible."

          # ⚠️ CORRECTIF : ces deux champs du formulaire (workflow_dispatch,
          # voir plus haut) n'étaient JUSQU'ICI jamais transmis au fichier
          # final — "obligatoire" n'était même pas écrit, et
          # "version_minimale" restait figé à "" quel que soit le formulaire.
          # Un utilisateur cochant "obligatoire" publiait donc, sans le
          # savoir, une mise à jour parfaitement NORMALE : aucun blocage ne
          # pouvait jamais se produire.
          OBLIGATOIRE="${{ inputs.obligatoire }}"
          [ -z "$OBLIGATOIRE" ] && OBLIGATOIRE="false"

          MINIMALE="${{ inputs.version_minimale }}"
          # Règle documentée dans MISE_EN_PLACE_MISES_A_JOUR.md : si
          # "obligatoire" est coché et qu'aucun seuil n'est précisé, la
          # version publiée elle-même sert de seuil — TOUT poste non encore
          # sur cette version est alors bloqué.
          if [ "$OBLIGATOIRE" = "true" ] && [ -z "$MINIMALE" ]; then
            MINIMALE="$VERSION"
          fi

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "url": "https://github.com/$DEPOT/releases/latest",
            "notes": "$NOTES",
            "version_minimale": "$MINIMALE",
            "obligatoire": $OBLIGATOIRE
          }
          EOF
          echo "Contenu publié :" && cat version.json

          git clone --depth 1 \
            "https://x-access-token:${RELEASES_TOKEN}@github.com/${DEPOT}.git" public
          cp version.json public/version.json
          cd public
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add version.json
          git diff --cached --quiet || git commit -m "Version $VERSION"
          git push
